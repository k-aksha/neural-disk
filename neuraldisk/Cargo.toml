[package]
name = "neuraldisk"
version = "1.0.0"
authors = ["Rafał Mikrut <mikrutrafal@protonmail.com>"]
edition = "2024"
rust-version = "1.94.1"
description = "Slint frontend of NeuralDisk Core"
license = "GPL-3.0-only"
homepage = "https://github.com/k-aksha/neural-disk"
repository = "https://github.com/k-aksha/neural-disk"
build = "build.rs"

[dependencies]
neuraldisk_core = { version = "1.0.0", path = "../neuraldisk_core" }
chrono = "0.4.38"
open = "5.3"
crossbeam-channel = "0.5"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
home = "0.5"
log = "0.4.22"
serde = "1.0"
serde_json = "1.0"
humansize = "2.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
fs_extra = "1.3" # TODO replace with less buggy library
num_enum = "0.7.5"
regex = "1.11"
arboard = "3"

# Local LLM copilot (talks to a user-run Ollama server over plain HTTP - no TLS/async runtime needed)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }

# Translations
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10"
rust-embed = { version = "8.5", features = ["debug-embed"] }

# Try to use only needed features from https://github.com/slint-ui/slint/blob/master/api/rs/slint/Cargo.toml#L23-L31
#slint = { path = "/home/rafal/test/slint/api/rs/slint/", default-features = false, features = [
#slint = { git = "https://github.com/slint-ui/slint.git", default-features = false, features = [
slint = { version = "=1.17.0", default-features = false, features = [
    "std",
    "backend-winit",
    "compat-1-2",
] }

rodio = { version = "0.22.0", default-features = false, features = ["playback", "symphonia-all"], optional = true }
notify-rust = { version = "4" }

# Easier cross-compilation of app to e.g. 32 bit os, by using dlopen instead of linking libraries at compile time
# Must match version used in slint
fontique = { version = "=0.10.0", default-features = false, features = ["fontconfig-dlopen", "std"] }

[build-dependencies]
#slint-build = { path = "/home/rafal/test/slint/api/rs/build/"}
#slint-build = { git = "https://github.com/slint-ui/slint.git" }
slint-build = "=1.17.0"

[features]
default = ["winit_femtovg", "winit_software"]

# Audio support
audio = ["rodio"]

# Renderers
skia_opengl = ["slint/renderer-skia-opengl"]
skia_vulkan = ["slint/renderer-skia-vulkan"]
software = ["slint/renderer-software"]
femtovg = ["slint/renderer-femtovg"]
femtovg_wgpu = ["slint/renderer-femtovg-wgpu"]
winit_femtovg = ["slint/renderer-winit-femtovg"]
winit_skia_opengl = ["slint/renderer-winit-skia-opengl"]
winit_skia_vulkan = ["slint/renderer-winit-skia-vulkan"]
winit_software = ["slint/renderer-winit-software"]

# Additional features
heif = ["neuraldisk_core/heif"]
libraw = ["neuraldisk_core/libraw"]
libavif = ["neuraldisk_core/libavif"]

# Allows to use trash on Linux when using xdg-portal, needed by e.g. flatpak where normal trash access always fails
# No-op on other OSes, it is slower and provides less helpful error messages
xdg_portal_trash = ["neuraldisk_core/xdg_portal_trash"]

[lints]
workspace = true

# Debian package, built via `cargo deb -p neuraldisk` (cargo-deb). The Ollama
# setup prompts live in packaging/linux/debian/{templates,postinst} (debconf,
# not a raw TTY prompt - required by Debian policy and correctly no-ops under
# unattended/non-interactive installs instead of hanging).
[package.metadata.deb]
name = "neuraldisk"
maintainer = "NeuralDisk <https://github.com/k-aksha/neural-disk>"
copyright = "2020-2026, Rafał Mikrut and NeuralDisk contributors"
license-file = ["LICENSE_GPL_APP", "0"]
extended-description = """\
NeuralDisk is a simple, multiplatform, fast, and free app to remove \
unnecessary files from your computer, with an optional AI copilot (backed by \
a locally-run Ollama server) that can drive the cleanup for you, one \
confirmed action at a time."""
depends = "$auto"
section = "utils"
priority = "optional"
maintainer-scripts = "../packaging/linux/debian"
assets = [
    ["target/release/neuraldisk", "usr/bin/", "755"],
    ["../data/io.neuraldisk.neuraldisk.desktop", "usr/share/applications/io.neuraldisk.neuraldisk.desktop", "644"],
    ["../data/io.neuraldisk.neuraldisk.metainfo.xml", "usr/share/metainfo/io.neuraldisk.neuraldisk.metainfo.xml", "644"],
    ["../data/icons/io.neuraldisk.neuraldisk.svg", "usr/share/icons/hicolor/scalable/apps/io.neuraldisk.neuraldisk.svg", "644"],
]
