name: 🍎 MacOS

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CZKAWKA_OFFICIAL_BUILD: ${{ vars.CZKAWKA_OFFICIAL_BUILD }}

jobs:
  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Setup env
        run: |
          ARCHNAME=$([ "${{ runner.arch }}" = "ARM64" ] && echo arm64 || echo x86_64)
          echo "ARCHNAME=$ARCHNAME" >> $GITHUB_ENV

      - name: Setup rust version
        run: rustup default 1.94.1

      - name: Install Homebrew
        run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

      - name: Install GTK4
        run: |
          brew install gtk4 libheif libavif dav1d || true

      - name: Build Release
        if: ${{ github.ref == 'refs/heads/master' }}
        run: |
          set -e
          sed -i '' 's/#lto = "thin"/lto = "thin"/g' Cargo.toml
          sed -i '' 's/#codegen-units /codegen-units /g' Cargo.toml

          echo "VERS=release" >> $GITHUB_ENV

          export LIBRARY_PATH=$LIBRARY_PATH:$(brew --prefix)/lib

          cargo build --release
          mv target/release/neuraldisk_cli mac_neuraldisk_cli_${{ env.ARCHNAME }}
          mv target/release/neuraldisk_gui mac_neuraldisk_gui_${{ env.ARCHNAME }}
          mv target/release/neuraldisk mac_neuraldisk_${{ env.ARCHNAME }}
          cargo build --release --bin neuraldisk --no-default-features --features "winit_skia_vulkan,winit_software"
          mv target/release/neuraldisk mac_neuraldisk_skia_vulkan_${{ env.ARCHNAME }}
          cargo build --release --bin neuraldisk --no-default-features --features "femtovg_wgpu"
          mv target/release/neuraldisk mac_neuraldisk_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo build --release --bin neuraldisk --no-default-features --features "winit_femtovg,winit_skia_opengl,winit_skia_vulkan,winit_software,femtovg_wgpu"
          mv target/release/neuraldisk mac_neuraldisk_all_backends_${{ env.ARCHNAME }}

          cargo build --release --features "heif,libavif"
          mv target/release/neuraldisk_cli mac_neuraldisk_cli_heif_avif_${{ env.ARCHNAME }}
          mv target/release/neuraldisk_gui mac_neuraldisk_gui_heif_avif_${{ env.ARCHNAME }}
          mv target/release/neuraldisk mac_neuraldisk_heif_avif_${{ env.ARCHNAME }}
          cargo build --release --bin neuraldisk --no-default-features --features "winit_skia_vulkan,winit_software,heif,libavif"
          mv target/release/neuraldisk mac_neuraldisk_skia_vulkan_heif_avif_${{ env.ARCHNAME }}
          cargo build --release --bin neuraldisk --no-default-features --features "femtovg_wgpu,heif,libavif"
          mv target/release/neuraldisk mac_neuraldisk_heif_avif_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo build --release --bin neuraldisk --no-default-features --features "winit_femtovg,winit_skia_opengl,winit_skia_vulkan,winit_software,femtovg_wgpu,heif,libavif"
          mv target/release/neuraldisk mac_neuraldisk_heif_avif_all_backends_${{ env.ARCHNAME }}

      - name: Build Debug
        if: ${{ github.ref != 'refs/heads/master' }}
        run: |
          set -e
          sed -i '' 's/^\(\[profile\.dev\.package.*\)/#\1/' Cargo.toml
          sed -i '' 's|^opt-level = 3 # OPT PACKAGES|#opt-level = 3 # OPT PACKAGES|' Cargo.toml

          echo "VERS=debug" >> $GITHUB_ENV

          export LIBRARY_PATH=$LIBRARY_PATH:$(brew --prefix)/lib

          cargo build --profile fastci
          mv target/fastci/neuraldisk_cli mac_neuraldisk_cli_${{ env.ARCHNAME }}
          mv target/fastci/neuraldisk_gui mac_neuraldisk_gui_${{ env.ARCHNAME }}
          mv target/fastci/neuraldisk mac_neuraldisk_${{ env.ARCHNAME }}
          cargo build --profile fastci --bin neuraldisk --no-default-features --features "winit_skia_vulkan,winit_software"
          mv target/fastci/neuraldisk mac_neuraldisk_skia_vulkan_${{ env.ARCHNAME }}
          cargo build --profile fastci --bin neuraldisk --no-default-features --features "femtovg_wgpu"
          mv target/fastci/neuraldisk mac_neuraldisk_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo build --profile fastci --bin neuraldisk --no-default-features --features "winit_femtovg,winit_skia_opengl,winit_skia_vulkan,winit_software,femtovg_wgpu"
          mv target/fastci/neuraldisk mac_neuraldisk_all_backends_${{ env.ARCHNAME }}

          cargo build --profile fastci --features "heif,libavif"
          mv target/fastci/neuraldisk_cli mac_neuraldisk_cli_heif_avif_${{ env.ARCHNAME }}
          mv target/fastci/neuraldisk_gui mac_neuraldisk_gui_heif_avif_${{ env.ARCHNAME }}
          mv target/fastci/neuraldisk mac_neuraldisk_heif_avif_${{ env.ARCHNAME }}
          cargo build --profile fastci --bin neuraldisk --no-default-features --features "winit_skia_vulkan,winit_software,heif,libavif"
          mv target/fastci/neuraldisk mac_neuraldisk_skia_vulkan_heif_avif_${{ env.ARCHNAME }}
          cargo build --profile fastci --bin neuraldisk --no-default-features --features "femtovg_wgpu,heif,libavif"
          mv target/fastci/neuraldisk mac_neuraldisk_heif_avif_femtovg_wgpu_${{ env.ARCHNAME }}
          cargo build --profile fastci --bin neuraldisk --no-default-features --features "winit_femtovg,winit_skia_opengl,winit_skia_vulkan,winit_software,femtovg_wgpu,heif,libavif"
          mv target/fastci/neuraldisk mac_neuraldisk_heif_avif_all_backends_${{ env.ARCHNAME }}

      - name: Package NeuralDisk with launchers
        run: |
          bash misc/pack_all_backends.sh mac_neuraldisk_all_backends_${{ env.ARCHNAME }} mac_neuraldisk_all_backends_${{ env.ARCHNAME }}.zip
          bash misc/pack_all_backends.sh mac_neuraldisk_heif_avif_all_backends_${{ env.ARCHNAME }} mac_neuraldisk_heif_avif_all_backends_${{ env.ARCHNAME }}.zip

      - name: Build .pkg installer
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' neuraldisk_core/Cargo.toml | head -1)
          echo "PKG_VERSION=$VERSION" >> $GITHUB_ENV
          bash packaging/macos/build_pkg.sh "mac_neuraldisk_${{ env.ARCHNAME }}" "$VERSION" "$PWD"
          mv "NeuralDisk-$VERSION.pkg" "NeuralDisk-$VERSION-${{ env.ARCHNAME }}.pkg"

      - name: Store MacOS
        uses: actions/upload-artifact@v6
        with:
          name: all-${{ runner.os }}-${{ runner.arch }}-${{ env.VERS }}
          path: |
            mac_neuraldisk_all_backends_${{ env.ARCHNAME }}.zip
            mac_neuraldisk_cli_heif_avif_${{ env.ARCHNAME }}
            mac_neuraldisk_gui_heif_avif_${{ env.ARCHNAME }}
            mac_neuraldisk_heif_avif_${{ env.ARCHNAME }}
            mac_neuraldisk_heif_avif_femtovg_wgpu_${{ env.ARCHNAME }}
            mac_neuraldisk_heif_avif_all_backends_${{ env.ARCHNAME }}.zip
            mac_neuraldisk_cli_${{ env.ARCHNAME }}
            mac_neuraldisk_gui_${{ env.ARCHNAME }}
            mac_neuraldisk_${{ env.ARCHNAME }}
            mac_neuraldisk_skia_vulkan_heif_avif_${{ env.ARCHNAME }}
            mac_neuraldisk_skia_vulkan_${{ env.ARCHNAME }}
            mac_neuraldisk_femtovg_wgpu_${{ env.ARCHNAME }}
            NeuralDisk-${{ env.PKG_VERSION }}-${{ env.ARCHNAME }}.pkg

      - name: Release
        if: ${{ github.ref == 'refs/heads/master' && vars.HAVE_PAT_REPOSITORY_TOKEN == '1' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "Nightly"
          files: |
            mac_neuraldisk_all_backends_${{ env.ARCHNAME }}.zip
            mac_neuraldisk_cli_heif_avif_${{ env.ARCHNAME }}
            mac_neuraldisk_gui_heif_avif_${{ env.ARCHNAME }}
            mac_neuraldisk_heif_avif_${{ env.ARCHNAME }}
            mac_neuraldisk_heif_avif_femtovg_wgpu_${{ env.ARCHNAME }}
            mac_neuraldisk_heif_avif_all_backends_${{ env.ARCHNAME }}.zip
            mac_neuraldisk_cli_${{ env.ARCHNAME }}
            mac_neuraldisk_gui_${{ env.ARCHNAME }}
            mac_neuraldisk_${{ env.ARCHNAME }}
            mac_neuraldisk_skia_vulkan_heif_avif_${{ env.ARCHNAME }}
            mac_neuraldisk_skia_vulkan_${{ env.ARCHNAME }}
            mac_neuraldisk_femtovg_wgpu_${{ env.ARCHNAME }}
            NeuralDisk-${{ env.PKG_VERSION }}-${{ env.ARCHNAME }}.pkg
          token: ${{ secrets.PAT_REPOSITORY }}
